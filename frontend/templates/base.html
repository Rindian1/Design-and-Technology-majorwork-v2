<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Energy Monitoring Dashboard">
  <title>{% block title %}Energy Monitor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=31">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <header class="header">
    <div class="container">
      <button class="tab-btn header-logo active" data-tab="graph">Home</button>
      <button class="tab-btn" data-tab="goals">Goals</button>
      <button class="tab-btn" data-tab="general">General Insights</button>
      <button class="tab-btn" data-tab="appliance">Appliance Insights</button>
      <button class="tab-btn" data-tab="plugs">Plugs</button>
      <div class="header-spacer"></div>
      <span class="info-trigger" data-info-key="points" tabindex="0" role="button" aria-label="More info about points">ℹ</span>
      <button class="points-badge" id="points-badge" data-tab="goals" title="View Goals">
        <span class="points-badge-icon"><img src="/static/images/Medal.svg?v=1" alt="Medal" class="points-badge-img"></span>
        <span class="points-badge-value" id="points-badge-value">0</span>
      </button>
      <div class="user-menu" id="user-menu">
        <button class="user-menu-btn" id="user-menu-btn" aria-label="Menu">
          <span class="user-menu-dots">•••</span>
        </button>
        <div class="user-dropdown" id="user-dropdown">
          <button id="edit-preferences-btn">Edit Preferences</button>
          <hr class="dropdown-sep">
          <button id="theme-toggle-btn">Light Mode</button>
          <hr class="dropdown-sep">
          <button id="exit-btn">Exit</button>
          <hr class="dropdown-sep">
          <button id="logout-btn">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading energy data...</p>
  </div>

  <div id="error-modal" class="modal hidden" role="dialog" aria-labelledby="error-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="error-title">Error</h2>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="error-message">An error occurred while loading data.</p>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="confirm-title">Are you sure?</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message">Are you sure you would like to do this?</p>
      </div>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/info-popups.js') }}?v=6"></script>
  <script src="{{ url_for('static', filename='js/api.js') }}?v=5"></script>
  <script src="{{ url_for('static', filename='js/navigation.js') }}?v=5"></script>
  <script src="{{ url_for('static', filename='js/gauge.js') }}?v=5"></script>
  <script src="{{ url_for('static', filename='js/recommendations.js') }}?v=13"></script>
  <script src="{{ url_for('static', filename='js/goals.js') }}?v=19"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=6"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}?v=20"></script>
  <script src="{{ url_for('static', filename='js/plugs.js') }}?v=3"></script>
  <script src="{{ url_for('static', filename='js/keyboard.js') }}?v=1"></script>
  <script src="{{ url_for('static', filename='js/touch-scroll.js') }}?v=2"></script>
</body>
</html>
